name: Build ICE IT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found!"
            ls -la
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d source

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Gradle project and build
        run: |
          GRADLEW=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew!"
            find source -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          printf '\n\ntasks.withType<Jar>().configureEach {\n    duplicatesStrategy = DuplicatesStrategy.EXCLUDE\n}\n' >> build.gradle.kts
          ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ICE-IT-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
